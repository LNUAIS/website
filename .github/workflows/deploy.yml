name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy without a code change — useful because the events section
  # splits upcoming from past against the build clock.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a malformed content file, or a scaffold that has drifted from
      # its loader, before anything reaches Cloudflare.
      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npx opennextjs-cloudflare build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
